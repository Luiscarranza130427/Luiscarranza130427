<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="240" fill="none">
  <style>
    @keyframes pulseCyan {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes pulseRing {
      0% { r: 3.5; opacity: 0.8; }
      100% { r: 8; opacity: 0; }
    }
    @keyframes cardBorder {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }
    .card-border-active {
      animation: cardBorder 3s ease-in-out infinite;
    }
    .status-dot {
      animation: pulseCyan 1.8s infinite ease-in-out;
    }
    .status-ring {
      animation: pulseRing 1.8s infinite cubic-bezier(0.2, 0.6, 0.4, 1);
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #ffffff;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060c1c" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00223e"/>
      <stop offset="100%" stop-color="#030c1e"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- CARD 1: NOVATEC -->
  <g>
    <rect x="5" y="5" width="405" height="105" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" class="card-border-active"/>
    
    <!-- Real NT Vector Logo -->
    <g transform="translate(18, 18)">
      <rect width="40" height="40" rx="10" fill="url(#iconBg)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Stylized NT mark matching official logo -->
      <path d="M12 28V12L20 28V12" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M18 12H28M23 12V28" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    
    <text x="70" y="34" class="title">NovaTec</text>
    <text x="70" y="52" class="desc">Ecosistema digital y soluciones tecnológicas.</text>

    <!-- Badges -->
    <rect x="70" y="70" width="46" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="93" y="85" class="tag" fill="#38bdf8" text-anchor="middle">Web</text>
    
    <rect x="122" y="70" width="50" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="147" y="85" class="tag" fill="#38bdf8" text-anchor="middle">Cloud</text>
    
    <rect x="178" y="70" width="34" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="195" y="85" class="tag" fill="#00f2fe" text-anchor="middle">AI</text>

    <!-- Status: Rebuilding neatly on top right -->
    <g transform="translate(285, 18)">
      <rect x="0" y="0" width="105" height="24" rx="12" fill="#042f2e" stroke="#0d9488" stroke-width="1.2"/>
      <circle cx="14" cy="12" r="3.5" fill="#00f2fe" class="status-dot"/>
      <circle cx="14" cy="12" r="3.5" stroke="#00f2fe" fill="none" stroke-width="1" class="status-ring"/>
      <text x="28" y="16" class="tag" fill="#2dd4bf" font-weight="700">Rebuilding</text>
    </g>
  </g>

  <!-- CARD 2: GYM BROS -->
  <g>
    <rect x="430" y="5" width="405" height="105" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" class="card-border-active"/>
    
    <!-- Real Barbell Vector Icon -->
    <g transform="translate(443, 18)">
      <rect width="40" height="40" rx="10" fill="url(#iconBg)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
      <g transform="translate(8, 8)" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="2" y1="12" x2="22" y2="12"/>
        <rect x="5" y="7" width="3" height="10" rx="1"/>
        <rect x="16" y="7" width="3" height="10" rx="1"/>
        <line x1="2" y1="9" x2="2" y2="15"/>
        <line x1="22" y1="9" x2="22" y2="15"/>
      </g>
    </g>

    <text x="495" y="34" class="title">Gym Bros</text>
    <text x="495" y="52" class="desc">Plataforma SaaS para gestión integral de gimnasios.</text>

    <!-- Badges -->
    <rect x="495" y="70" width="48" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="519" y="85" class="tag" fill="#38bdf8" text-anchor="middle">SaaS</text>

    <rect x="549" y="70" width="56" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="577" y="85" class="tag" fill="#38bdf8" text-anchor="middle">Fitness</text>

    <rect x="611" y="70" width="52" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="637" y="85" class="tag" fill="#00f2fe" text-anchor="middle">Mobile</text>

    <!-- Status: Rebuilding neatly on top right -->
    <g transform="translate(710, 18)">
      <rect x="0" y="0" width="105" height="24" rx="12" fill="#042f2e" stroke="#0d9488" stroke-width="1.2"/>
      <circle cx="14" cy="12" r="3.5" fill="#00f2fe" class="status-dot"/>
      <circle cx="14" cy="12" r="3.5" stroke="#00f2fe" fill="none" stroke-width="1" class="status-ring"/>
      <text x="28" y="16" class="tag" fill="#2dd4bf" font-weight="700">Rebuilding</text>
    </g>
  </g>

  <!-- CARD 3: NOVAHUB -->
  <g>
    <rect x="5" y="125" width="405" height="105" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Real 3D Cube / DevTools Vector Icon -->
    <g transform="translate(18, 138)">
      <rect width="40" height="40" rx="10" fill="url(#iconBg)" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.6"/>
      <g transform="translate(8, 8)" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </g>
    </g>

    <text x="70" y="154" class="title">NovaHub</text>
    <text x="70" y="172" class="desc">Plataforma privada para desarrollo y colaboración.</text>

    <!-- Badges -->
    <rect x="70" y="190" width="65" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="102" y="205" class="tag" fill="#94a3b8" text-anchor="middle">DevTools</text>

    <rect x="141" y="190" width="56" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="169" y="205" class="tag" fill="#94a3b8" text-anchor="middle">Private</text>

    <!-- Status: Planned -->
    <g transform="translate(305, 138)">
      <rect x="0" y="0" width="85" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="14" cy="12" r="3.5" fill="#94a3b8"/>
      <text x="26" y="16" class="tag" fill="#cbd5e1" font-weight="600">Planned</text>
    </g>
  </g>

  <!-- CARD 4: NOVAACADEMY -->
  <g>
    <rect x="430" y="125" width="405" height="105" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Real Graduation Cap Vector Icon -->
    <g transform="translate(443, 138)">
      <rect width="40" height="40" rx="10" fill="url(#iconBg)" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.6"/>
      <g transform="translate(8, 8)" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </g>
    </g>

    <text x="495" y="154" class="title">NovaAcademy</text>
    <text x="495" y="172" class="desc">Plataforma de aprendizaje digital y formación tech.</text>

    <!-- Badges -->
    <rect x="495" y="190" width="56" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="523" y="205" class="tag" fill="#94a3b8" text-anchor="middle">EdTech</text>

    <rect x="557" y="190" width="56" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="585" y="205" class="tag" fill="#94a3b8" text-anchor="middle">Cursos</text>

    <!-- Status: Planned -->
    <g transform="translate(730, 138)">
      <rect x="0" y="0" width="85" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="14" cy="12" r="3.5" fill="#94a3b8"/>
      <text x="26" y="16" class="tag" fill="#cbd5e1" font-weight="600">Planned</text>
    </g>
  </g>
</svg>
