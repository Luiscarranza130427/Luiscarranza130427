<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="240" fill="none">
  <style>
    @keyframes pulseCyan {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes pulseRing {
      0% { r: 4; opacity: 0.8; }
      100% { r: 10; opacity: 0; }
    }
    @keyframes cardBorder {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.85; }
    }
    .card {
      transition: all 0.3s ease;
    }
    .card-border-active {
      animation: cardBorder 3s ease-in-out infinite;
    }
    .status-dot {
      transform-origin: center;
      animation: pulseCyan 2s infinite ease-in-out;
    }
    .status-ring {
      transform-origin: center;
      animation: pulseRing 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #ffffff;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060c1c" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CARD 1: NOVATEC -->
  <g class="card">
    <rect x="5" y="5" width="405" height="105" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" class="card-border-active"/>
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#030712" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4"/>
    <text x="37" y="42" text-anchor="middle" font-size="16" fill="#00f2fe" font-weight="900" font-family="sans-serif">NT</text>
    
    <text x="66" y="36" class="title">NovaTec</text>
    <text x="66" y="54" class="desc">Ecosistema digital y desarrollo de soluciones de software.</text>

    <!-- Badges -->
    <rect x="66" y="70" width="48" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="90" y="85" class="tag" fill="#38bdf8" text-anchor="middle">Web</text>
    
    <rect x="120" y="70" width="48" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="144" y="85" class="tag" fill="#38bdf8" text-anchor="middle">Cloud</text>
    
    <rect x="174" y="70" width="36" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="192" y="85" class="tag" fill="#00f2fe" text-anchor="middle">AI</text>

    <!-- Status: Rebuilding with Radar Pulse -->
    <g transform="translate(305, 30)">
      <rect x="0" y="0" width="92" height="22" rx="11" fill="#042f2e" stroke="#0d9488" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="14" cy="11" r="3.5" fill="#00f2fe" class="status-dot"/>
      <circle cx="14" cy="11" r="6" stroke="#00f2fe" fill="none" stroke-width="1" class="status-ring"/>
      <text x="24" y="15" class="tag" fill="#2dd4bf">Rebuilding</text>
    </g>
  </g>

  <!-- CARD 2: GYM BROS -->
  <g class="card">
    <rect x="430" y="5" width="405" height="105" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" class="card-border-active"/>
    <rect x="445" y="20" width="34" height="34" rx="8" fill="#030712" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="462" y="43" text-anchor="middle" font-size="18">🏋️</text>

    <text x="491" y="36" class="title">Gym Bros</text>
    <text x="491" y="54" class="desc">Plataforma SaaS integral para gestión y métricas de gimnasios.</text>

    <!-- Badges -->
    <rect x="491" y="70" width="50" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="516" y="85" class="tag" fill="#38bdf8" text-anchor="middle">SaaS</text>

    <rect x="547" y="70" width="56" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="575" y="85" class="tag" fill="#38bdf8" text-anchor="middle">Fitness</text>

    <rect x="609" y="70" width="50" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="634" y="85" class="tag" fill="#00f2fe" text-anchor="middle">Mobile</text>

    <!-- Status: Rebuilding with Radar Pulse -->
    <g transform="translate(730, 30)">
      <rect x="0" y="0" width="92" height="22" rx="11" fill="#042f2e" stroke="#0d9488" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="14" cy="11" r="3.5" fill="#00f2fe" class="status-dot"/>
      <circle cx="14" cy="11" r="6" stroke="#00f2fe" fill="none" stroke-width="1" class="status-ring"/>
      <text x="24" y="15" class="tag" fill="#2dd4bf">Rebuilding</text>
    </g>
  </g>

  <!-- CARD 3: NOVAHUB -->
  <g class="card">
    <rect x="5" y="125" width="405" height="105" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="20" y="140" width="34" height="34" rx="8" fill="#030712" stroke="#64748b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="37" y="163" text-anchor="middle" font-size="18">📦</text>

    <text x="66" y="156" class="title">NovaHub</text>
    <text x="66" y="174" class="desc">Plataforma privada para herramientas internas y colaboración.</text>

    <!-- Badges -->
    <rect x="66" y="190" width="65" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="98" y="205" class="tag" fill="#94a3b8" text-anchor="middle">DevTools</text>

    <rect x="137" y="190" width="56" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="165" y="205" class="tag" fill="#94a3b8" text-anchor="middle">Private</text>

    <!-- Status: Planned -->
    <g transform="translate(325, 150)">
      <rect x="0" y="0" width="72" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#94a3b8"/>
      <text x="22" y="15" class="tag" fill="#cbd5e1">Planned</text>
    </g>
  </g>

  <!-- CARD 4: NOVAACADEMY -->
  <g class="card">
    <rect x="430" y="125" width="405" height="105" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="445" y="140" width="34" height="34" rx="8" fill="#030712" stroke="#64748b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="462" y="163" text-anchor="middle" font-size="18">🎓</text>

    <text x="491" y="156" class="title">NovaAcademy</text>
    <text x="491" y="174" class="desc">Plataforma de aprendizaje digital y formación en tecnología.</text>

    <!-- Badges -->
    <rect x="491" y="190" width="58" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="520" y="205" class="tag" fill="#94a3b8" text-anchor="middle">EdTech</text>

    <rect x="555" y="190" width="60" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="585" y="205" class="tag" fill="#94a3b8" text-anchor="middle">Cursos</text>

    <!-- Status: Planned -->
    <g transform="translate(750, 150)">
      <rect x="0" y="0" width="72" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#94a3b8"/>
      <text x="22" y="15" class="tag" fill="#cbd5e1">Planned</text>
    </g>
  </g>
</svg>
