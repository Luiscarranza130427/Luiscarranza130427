<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="100%" height="230" fill="none">
  <style>
    @keyframes glowBorder {
      0%, 100% { stroke: #1e293b; stroke-width: 1.5; }
      50% { stroke: #00f2fe; stroke-width: 1.5; filter: drop-shadow(0 0 4px #00f2fe); }
    }
    @keyframes iconFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .service-card {
      transition: transform 0.2s ease;
    }
    .service-border-1 {
      animation: glowBorder 4s infinite ease-in-out;
    }
    .service-border-2 {
      animation: glowBorder 4s infinite ease-in-out 1s;
    }
    .service-border-3 {
      animation: glowBorder 4s infinite ease-in-out 2s;
    }
    .service-border-4 {
      animation: glowBorder 4s infinite ease-in-out 3s;
    }
    .icon-anim {
      animation: iconFloat 3s infinite ease-in-out;
    }
    .svc-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #ffffff;
    }
    .svc-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .svc-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #38bdf8;
    }
  </style>

  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070d1e" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- CARD 1: DESARROLLO WEB -->
  <g class="service-card">
    <rect x="5" y="5" width="405" height="100" rx="12" fill="url(#cardGrad)" class="service-border-1" stroke="#1e293b"/>
    <g transform="translate(20, 20)">
      <rect width="36" height="36" rx="8" fill="#030712" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4"/>
      <text x="18" y="24" text-anchor="middle" font-size="18">🌐</text>
    </g>
    <text x="70" y="34" class="svc-title">Desarrollo Web &amp; Sistemas</text>
    <text x="70" y="52" class="svc-desc">Aplicaciones web modernas, dashboards reactivos</text>
    <text x="70" y="68" class="svc-desc">y paneles administrativos de alta eficiencia.</text>
    <text x="70" y="88" class="svc-sub">React · Next.js · TypeScript · Tailwind</text>
  </g>

  <!-- CARD 2: PLATAFORMAS SAAS -->
  <g class="service-card">
    <rect x="430" y="5" width="405" height="100" rx="12" fill="url(#cardGrad)" class="service-border-2" stroke="#1e293b"/>
    <g transform="translate(445, 20)">
      <rect width="36" height="36" rx="8" fill="#030712" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
      <text x="18" y="24" text-anchor="middle" font-size="18">⚡</text>
    </g>
    <text x="495" y="34" class="svc-title">Plataformas SaaS Escalables</text>
    <text x="495" y="52" class="svc-desc">Arquitecturas multi-tenant, pasarelas de pago,</text>
    <text x="495" y="68" class="svc-desc">suscripciones y gestión granular de permisos.</text>
    <text x="495" y="88" class="svc-sub">SaaS Architecture · Multi-tenant · Auth RBAC</text>
  </g>

  <!-- CARD 3: APIS & BACKEND -->
  <g class="service-card">
    <rect x="5" y="118" width="405" height="100" rx="12" fill="url(#cardGrad)" class="service-border-3" stroke="#1e293b"/>
    <g transform="translate(20, 133)">
      <rect width="36" height="36" rx="8" fill="#030712" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.4"/>
      <text x="18" y="24" text-anchor="middle" font-size="18">🔌</text>
    </g>
    <text x="70" y="147" class="svc-title">APIs &amp; Backend Architecture</text>
    <text x="70" y="165" class="svc-desc">Microservicios y endpoints RESTful optimizados,</text>
    <text x="70" y="181" class="svc-desc">diseño seguro y bases de datos relacionales.</text>
    <text x="70" y="201" class="svc-sub">Node.js · Laravel · PostgreSQL · MySQL</text>
  </g>

  <!-- CARD 4: INTELIGENCIA ARTIFICIAL -->
  <g class="service-card">
    <rect x="430" y="118" width="405" height="100" rx="12" fill="url(#cardGrad)" class="service-border-4" stroke="#1e293b"/>
    <g transform="translate(445, 133)">
      <rect width="36" height="36" rx="8" fill="#030712" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4"/>
      <text x="18" y="24" text-anchor="middle" font-size="18">🧠</text>
    </g>
    <text x="495" y="147" class="svc-title">Software with AI &amp; Automation</text>
    <text x="495" y="165" class="svc-desc">Integración de modelos LLM, agentes autónomos,</text>
    <text x="495" y="181" class="svc-desc">automatización de flujos y herramientas cognitivas.</text>
    <text x="495" y="201" class="svc-sub">LLMs · AI Agents · RAG · Automations</text>
  </g>
</svg>
