<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="100%" height="230" fill="none">
  <style>
    @keyframes glowBorder {
      0%, 100% { stroke: #1e293b; stroke-width: 1.5; }
      50% { stroke: #00f2fe; stroke-width: 1.5; filter: drop-shadow(0 0 5px #00f2fe); }
    }
    @keyframes iconPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .service-card {
      transition: all 0.3s ease;
    }
    .service-border-1 {
      animation: glowBorder 4s infinite ease-in-out;
    }
    .service-border-2 {
      animation: glowBorder 4s infinite ease-in-out 1s;
    }
    .service-border-3 {
      animation: glowBorder 4s infinite ease-in-out 2s;
    }
    .service-border-4 {
      animation: glowBorder 4s infinite ease-in-out 3s;
    }
    .icon-box {
      transform-origin: center;
    }
    .svc-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #ffffff;
    }
    .svc-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .svc-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #38bdf8;
    }
  </style>

  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070d1e" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="iconBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b47"/>
      <stop offset="100%" stop-color="#020f26"/>
    </linearGradient>
  </defs>

  <!-- CARD 1: DESARROLLO WEB -->
  <g class="service-card">
    <rect x="5" y="5" width="405" height="100" rx="12" fill="url(#cardGrad)" class="service-border-1" stroke="#1e293b"/>
    
    <!-- Real Vector Icon: Monitor & Code -->
    <g transform="translate(18, 18)">
      <rect width="40" height="40" rx="10" fill="url(#iconBg1)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6"/>
      <g transform="translate(8, 8)" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
        <polyline points="7 9 5 10 7 11"/>
        <polyline points="17 9 19 10 17 11"/>
      </g>
    </g>

    <text x="72" y="34" class="svc-title">Desarrollo Web &amp; Sistemas</text>
    <text x="72" y="52" class="svc-desc">Aplicaciones web modernas, dashboards reactivos</text>
    <text x="72" y="68" class="svc-desc">y paneles administrativos de alta eficiencia.</text>
    <text x="72" y="88" class="svc-sub">React · Next.js · TypeScript · Tailwind</text>
  </g>

  <!-- CARD 2: PLATAFORMAS SAAS -->
  <g class="service-card">
    <rect x="430" y="5" width="405" height="100" rx="12" fill="url(#cardGrad)" class="service-border-2" stroke="#1e293b"/>
    
    <!-- Real Vector Icon: Cloud & Layers SaaS -->
    <g transform="translate(443, 18)">
      <rect width="40" height="40" rx="10" fill="url(#iconBg1)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
      <g transform="translate(8, 8)" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
      </g>
    </g>

    <text x="498" y="34" class="svc-title">Plataformas SaaS Escalables</text>
    <text x="498" y="52" class="svc-desc">Arquitecturas multi-tenant, pasarelas de pago,</text>
    <text x="498" y="68" class="svc-desc">suscripciones y gestión granular de permisos.</text>
    <text x="498" y="88" class="svc-sub">SaaS Architecture · Multi-tenant · Auth RBAC</text>
  </g>

  <!-- CARD 3: APIS & BACKEND -->
  <g class="service-card">
    <rect x="5" y="118" width="405" height="100" rx="12" fill="url(#cardGrad)" class="service-border-3" stroke="#1e293b"/>
    
    <!-- Real Vector Icon: Server Stack & Database -->
    <g transform="translate(18, 131)">
      <rect width="40" height="40" rx="10" fill="url(#iconBg1)" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6"/>
      <g transform="translate(8, 8)" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
        <line x1="6" y1="6" x2="6.01" y2="6"/>
        <line x1="6" y1="18" x2="6.01" y2="18"/>
      </g>
    </g>

    <text x="72" y="147" class="svc-title">APIs &amp; Backend Architecture</text>
    <text x="72" y="165" class="svc-desc">Microservicios y endpoints RESTful optimizados,</text>
    <text x="72" y="181" class="svc-desc">diseño seguro y bases de datos relacionales.</text>
    <text x="72" y="201" class="svc-sub">Node.js · Laravel · PostgreSQL · MySQL</text>
  </g>

  <!-- CARD 4: INTELIGENCIA ARTIFICIAL -->
  <g class="service-card">
    <rect x="430" y="118" width="405" height="100" rx="12" fill="url(#cardGrad)" class="service-border-4" stroke="#1e293b"/>
    
    <!-- Real Vector Icon: AI Brain & Circuit -->
    <g transform="translate(443, 131)">
      <rect width="40" height="40" rx="10" fill="url(#iconBg1)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6"/>
      <g transform="translate(8, 8)" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M12 2a4 4 0 0 0-4 4c0 .7.2 1.4.5 2H6a4 4 0 0 0-4 4 4 4 0 0 0 2.5 3.7A4 4 0 0 0 8 20a4 4 0 0 0 4-4v-2"/>
        <path d="M12 2a4 4 0 0 1 4 4c0 .7-.2 1.4-.5 2H18a4 4 0 0 1 4 4 4 4 0 0 1-2.5 3.7A4 4 0 0 1 16 20a4 4 0 0 1-4-4v-2"/>
        <line x1="12" y1="10" x2="12" y2="14"/>
      </g>
    </g>

    <text x="498" y="147" class="svc-title">Software with AI &amp; Automation</text>
    <text x="498" y="165" class="svc-desc">Integración de modelos LLM, agentes autónomos,</text>
    <text x="498" y="181" class="svc-desc">automatización de flujos y herramientas cognitivas.</text>
    <text x="498" y="201" class="svc-sub">LLMs · AI Agents · RAG · Automations</text>
  </g>
</svg>
